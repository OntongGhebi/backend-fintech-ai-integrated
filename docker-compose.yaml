services:
  redis:
    image: redis:8
    container_name: fintech-ai-redis
    restart: unless-stopped

    ports:
      - '127.0.0.1:6379:6379'

    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    command: ['redis-server', '/usr/local/etc/redis/redis.conf']

volumes:
  redis_data:
